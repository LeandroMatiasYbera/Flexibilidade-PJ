<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Portal PJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">Ybera · Gente &amp; Gestão</div>
      <h1>Portal PJ</h1>
      <p class="subtitle">Entre com sua conta para acessar Flexibilidade, Dossiê PJ e Administração.</p>

      <div class="error-msg" id="login-error"></div>
      <div class="ok-msg" id="login-ok"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="pw-field">
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="toggle-senha">Mostrar</button>
          </div>
        </div>
        <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      </form>

      <p class="hint" style="margin-top:14px; margin-bottom:0;">Esqueceu a senha? Peça para um administrador redefinir na tela de Administração — não há redefinição por e-mail neste sistema.</p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
